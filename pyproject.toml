[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "managed-switch-mcp"
version = "0.1.0"
description = "MCP server for GoodTop GT-ST018M managed switches (and clones with the same web UI) — read + write tools over the OEM HTTP UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Rowe" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
managed-switch-mcp = "managed_switch_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/managed_switch_mcp"]
